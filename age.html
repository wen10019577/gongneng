<h1>年龄计算器</h1><p class="subtitle">输入出生日期，计算周岁、虚岁、总天数</p><div class="card"><div class="form-group"><label>出生日期</label><input type="date" id="bd"></div><button class="btn" onclick="calc()">计算</button><div id="r" style="margin-top:20px;font-size:18px"></div></div><div class="card" style="margin-top:20px"><h2>说明</h2><p>周岁：国际通用，出生为0岁。虚岁：中国传统，出生为1岁。法律以周岁为准。</p><p><strong>退休年龄</strong>：男60岁，女工人50岁。<strong>结婚年龄</strong>：男22，女20周岁。</p></div><script>function calc(){const bd=new Date(document.getElementById("bd").value);if(isNaN(bd)){alert("请选择日期");return}const now=new Date(),days=Math.floor((now-bd)/864e5);let y=now.getFullYear()-bd.getFullYear(),m=now.getMonth()-bd.getMonth(),d=now.getDate()-bd.getDate();if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}const nx=new Date(now.getFullYear(),bd.getMonth(),bd.getDate());if(nx<=now)nx.setFullYear(nx.getFullYear()+1);document.getElementById("r").innerHTML="<p>🎂 周岁：<b>"+y+"岁"+m+"月"+d+"天</b></p><p>📅 虚岁：<b>"+(y+1)+"岁</b></p><p>⏱️ 已过：<b>"+days.toLocaleString()+"天</b></p><p>🎉 距下次生日：<b>"+Math.ceil((nx-now)/864e5)+"天</b></p>"}</script>
