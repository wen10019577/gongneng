<script>
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('endDate').value = today;
  // Default: 1 year ago
  const d = new Date();
  d.setFullYear(d.getFullYear() - 1);
  document.getElementById('startDate').value = d.toISOString().split('T')[0];
  calcDays();
});

function calcDays() {
  const s = new Date(document.getElementById('startDate').value);
  const e = new Date(document.getElementById('endDate').value || new Date().toISOString().split('T')[0]);
  if (isNaN(s)) return;
  
  const diff = e - s;
  const days = Math.round(diff / 86400000);
  const absDays = Math.abs(days);
  
  document.getElementById('dayCount').textContent = absDays;
  
  if (days >= 0) {
    document.getElementById('shareText').textContent = t('togetherText');
    document.getElementById('shareCard').style.background = 'linear-gradient(135deg, #2563eb, #7c3aed)';
  } else {
    document.getElementById('shareText').textContent = t('daysUntil');
    document.getElementById('shareCard').style.background = 'linear-gradient(135deg, #059669, #2563eb)';
  }

  // Details
  const weeks = Math.floor(absDays / 7);
  const months = Math.round(absDays / 30.44);
  const hours = absDays * 24;
  const detailsZh = `📅 共 <b>${absDays}</b> 天 ≈ <b>${weeks}</b> 周 ≈ <b>${months}</b> 个月<br>⏰ 约 <b>${hours.toLocaleString()}</b> 小时<br>💕 从 ${document.getElementById('startDate').value} 到 ${document.getElementById('endDate').value || '今天'}`;
  const detailsEn = `📅 Total <b>${absDays}</b> days ≈ <b>${weeks}</b> weeks ≈ <b>${months}</b> months<br>⏰ About <b>${hours.toLocaleString()}</b> hours<br>💕 From ${document.getElementById('startDate').value} to ${document.getElementById('endDate').value || 'today'}`;
  document.getElementById('details').innerHTML = lang === 'zh' ? detailsZh : detailsEn;
  
  document.getElementById('result').style.display = 'block';
}

function copyShare() {
  const days = document.getElementById('dayCount').textContent;
  const text = `${t('togetherText')} ${days} ${t('daysCount')} 💕 — CalcSmart`;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copyMsg').textContent = t('copied');
    setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
  });
}
